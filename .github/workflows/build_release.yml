name: Build Release APKs

on:
  push:
    branches:
      - main
      - master
      - feature/clerk-app
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      # Sirf asli errors build rokenge, chhote lint warnings nahi.
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Repo me test/ folder nahi hai, isliye tests tabhi chalenge jab folder ho.
      - name: Run Flutter tests (if any)
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test/ directory, skipping tests."
          fi

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create Flutter defines
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os

          defines = {}
          if os.environ.get("RAZORPAY_KEY_ID"):
              defines["RAZORPAY_KEY_ID"] = os.environ["RAZORPAY_KEY_ID"]
          else:
              print("WARNING: RAZORPAY_KEY_ID secret not set, building without it.")

          with open("dart_defines.json", "w", encoding="utf-8") as file:
              json.dump(defines, file)
          PY

      - name: Build split release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define-from-file=dart_defines.json

      - name: Check APK sizes
        run: |
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*-release.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No split release APKs were produced."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            size=$(stat -c%s "$apk")
            echo "$(basename "$apk"): $size bytes"
            if [ "$size" -ge 52428800 ]; then
              echo "$(basename "$apk") is not under 50 MB."
              exit 1
            fi
          done

      - name: Remove generated secrets
        if: always()
        run: rm -f dart_defines.json android/app/keystore.jks

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 30
