<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Maintix - professional water tank cleaning service. Book online in minutes.">
  <meta name="theme-color" content="#072654">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Maintix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Maintix - Water Tank Cleaning Service</title>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; }
    #maintix-loader {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; background: #ffffff; z-index: 1;
    }
    #maintix-loader .spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #d9eef4; border-top-color: #00A8CC;
      animation: maintix-spin 0.9s linear infinite;
    }
    @keyframes maintix-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="maintix-loader"><div class="spinner"></div></div>

  <!-- Razorpay checkout SDK (used by lib/services/razorpay_checkout_web.dart) -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('maintix-loader');
      if (loader) { loader.remove(); }
    });
  </script>
</body>
</html>
